name: Radio platforms
on:
  pull_request:
    paths: ['mods/cyberneon-radio/**', '.github/workflows/radio-platforms.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  radio:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12.10'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22.16.0'
      - name: Install test-owned mpv (Windows, pinned SHA-256)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $archive = Join-Path $env:RUNNER_TEMP 'mpv.zip'
          Invoke-WebRequest 'https://github.com/mpv-player/mpv/releases/download/v0.41.0/mpv-v0.41.0-x86_64-w64-mingw32.zip' -OutFile $archive
          if ((Get-FileHash $archive -Algorithm SHA256).Hash.ToLower() -ne 'a49811c0752c108b8260636f9c6f6fcb97406641c98b30f1e7b500dfb20177de') { throw 'mpv checksum mismatch' }
          $mpvDir = Join-Path $env:RUNNER_TEMP 'radio-mpv'
          Expand-Archive $archive $mpvDir
          $mpv = Get-ChildItem $mpvDir -Recurse -Filter mpv.exe | Select-Object -First 1
          if (-not $mpv) { throw 'mpv.exe missing from verified archive' }
          "RADIO_TEST_MPV_DIR=$($mpv.DirectoryName)" >> $env:GITHUB_ENV
          # Test fixture only: exercise the user's python3 executable contract.
          $python = (Get-Command python).Source
          $python3 = Join-Path (Split-Path $python) 'python3.exe'
          if (-not (Test-Path $python3)) { Copy-Item $python $python3 }
      - name: Install test mpv (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y mpv
      - name: Run portable Radio checks
        shell: python {0}
        run: |
          import os
          import runpy
          if os.environ.get("RADIO_TEST_MPV_DIR"):
              os.environ["PATH"] = os.environ["RADIO_TEST_MPV_DIR"] + os.pathsep + os.environ["PATH"]
          runpy.run_path("mods/cyberneon-radio/platform-suite.py", run_name="__main__")
