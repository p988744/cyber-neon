name: Radio platforms
on:
  pull_request:
    paths: ['mods/cyberneon-radio/**', '.github/workflows/radio-platforms.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  radio:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12.10'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22.16.0'
      - name: Install test-owned mpv (Windows, pinned SHA-256)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $archive = Join-Path $env:RUNNER_TEMP 'mpv.7z'
          Invoke-WebRequest 'https://github.com/shinchiro/mpv-winbuild-cmake/releases/download/20261111/mpv-x86_64-20261111-git-bcde6b93cc.7z' -OutFile $archive
          if ((Get-FileHash $archive -Algorithm SHA256).Hash.ToLower() -ne 'f259b5fd4b5c395617c948a4fadcdf55bba1c5282fb7c13e88626b3f71072baf') { throw 'mpv checksum mismatch' }
          $mpvDir = Join-Path $env:RUNNER_TEMP 'radio-mpv'
          7z x $archive "-o$mpvDir" -y
          if ($LASTEXITCODE -ne 0) { throw 'mpv extraction failed' }
          $mpv = Get-ChildItem $mpvDir -Recurse -Filter mpv.exe | Select-Object -First 1
          if (-not $mpv) { throw 'mpv.exe missing from verified archive' }
          $mpv.DirectoryName >> $env:GITHUB_PATH
          # Test fixture only: exercise the user's python3 executable contract.
          $python = (Get-Command python).Source
          $python3 = Join-Path (Split-Path $python) 'python3.exe'
          if (-not (Test-Path $python3)) { Copy-Item $python $python3 }
      - name: Install test mpv (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y mpv
      - name: Run portable Radio checks
        shell: bash
        run: |
          set -euo pipefail
          python3 --version
          mpv --version
          python3 -B mods/cyberneon-radio/windows-storage.check.py
          python3 -B mods/cyberneon-radio/storage.check.py
          python3 -B mods/cyberneon-radio/browser-open.check.py
          python3 -B mods/cyberneon-radio/windows-transport.check.py
          python3 -B mods/cyberneon-radio/receiver.check.py
          for test in ipc stations search browser browser-tuner ducking ducking-lifecycle tuner; do
            node "mods/cyberneon-radio/$test.check.mjs"
          done
          for test in tuner recovery queue ducking; do
            node "mods/cyberneon-radio/$test.integration.mjs"
          done
